<script>
(function () {
  var SALT = 'SeuXuenajwMkAa1waJUiSg==', ITER = 600000, KEY = 'bvm-textbook-key-' + SALT;
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function tob64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e2) {} } }
  function load(k) { try { var v = localStorage.getItem(k); if (v) return v; } catch (e) {} try { return sessionStorage.getItem(k); } catch (e2) { return null; } }
  var msg = document.getElementById('msg');
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
  }
  async function openWith(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var data = b64(document.getElementById('payload').textContent.trim());
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    var text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(text); document.close();
  }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    msg.textContent = 'このブラウザでは開けません。新しい Chrome・Safari・Edge・Firefox で開いてください。';
    return;
  }
  var saved = load(KEY);
  if (saved) { msg.textContent = '開いています…'; openWith(b64(saved)).catch(function () { store(KEY, null); msg.textContent = ''; }); }
  document.getElementById('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    msg.textContent = '確かめています…';
    try {
      var raw = await derive(document.getElementById('pw').value);
      await openWith(raw);
      store(KEY, tob64(raw));
    } catch (e) { msg.textContent = 'パスワードが違います。'; }
  });
})();
</script>
